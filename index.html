<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Simulador Vendas">
<meta name="theme-color" content="#111827">
<title>Simulador de Vendas</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#f5f5f7;color:#111827}
.wrap{max-width:520px;margin:auto;padding:16px}.card{background:white;border-radius:18px;padding:16px;margin-bottom:12px;box-shadow:0 2px 12px #00000010}
h1{font-size:23px;margin:0 0 4px}.muted{color:#6b7280;font-size:13px}.label{font-size:13px;font-weight:700;margin-bottom:6px;display:block}
select,input{width:100%;height:48px;border:1px solid #d1d5db;border-radius:12px;padding:0 12px;font-size:17px;background:white}
.row{display:grid;grid-template-columns:1fr 92px;gap:10px;align-items:center;padding:11px 0;border-bottom:1px solid #eee}.row:last-child{border-bottom:0}
.name{font-weight:650;font-size:15px}.measure{font-size:13px;color:#6b7280;margin-top:2px}
.summary{display:grid;grid-template-columns:1fr 1fr;gap:10px}.metric{background:#f3f4f6;border-radius:14px;padding:14px}.metric small{color:#6b7280}.metric strong{display:block;font-size:20px;margin-top:5px}
.total{grid-column:1/-1;background:#111827;color:white}.total small{color:#d1d5db}.total strong{font-size:28px}
button{width:100%;height:46px;border:0;border-radius:12px;font-weight:700;font-size:16px;background:#e5e7eb;color:#111827}
.note{font-size:12px;color:#6b7280;line-height:1.45}
@media(max-width:360px){.wrap{padding:10px}.row{grid-template-columns:1fr 82px}}
</style>
</head>
<body>
<div class="wrap">
<div class="card">
<h1>Simulador de Vendas</h1><div class="muted">Peitoris e soleiras • Região dos Lagos</div>
</div>
<div class="card">
<label class="label">TIPO DE CLIENTE</label>
<select id="tipo"><option>Loja / Cliente</option><option>Construtora</option></select>
</div>
<div class="card">
<div id="lista"></div>
</div>
<div class="summary">
<div class="metric"><small>Total de peças</small><strong id="qtd">0</strong></div>
<div class="metric"><small>Faixa aplicada</small><strong id="faixa">Até 200</strong></div>
<div class="metric total"><small>Total da venda</small><strong id="total">R$ 0,00</strong></div>
</div>
<div class="card"><button id="limpar">Limpar pedido</button></div>
<div class="card note">Regra: até 200 peças usa VENDA &lt;200. Acima de 200, loja usa VENDA 200+ e construtora usa CONSTRUTORAS 200+. O frete de entrega não está incluído.</div>
</div>
<script>
const produtos=[
["Soleira","0,64 × 13 cm",27,25,23],["Soleira","0,74 × 13 cm",29,27,26],["Soleira","0,84 × 13 cm",31,29,27],
["Peitoril — 2 lados","1,24 × 15 cm",48,44,41],["Peitoril — 2 lados","1,54 × 15 cm",56,54,50],["Peitoril — 2 lados","1,84 × 15 cm",66,64,58],["Peitoril — 2 lados","2,04 × 15 cm",72,70,64],
["Peitoril com ressalto","1,24 × 15 cm",68,66,59],["Peitoril com ressalto","1,54 × 15 cm",82,80,72],["Peitoril com ressalto","1,84 × 15 cm",96,94,84],["Peitoril com ressalto","2,04 × 15 cm",106,104,93]
];
const lista=document.getElementById("lista");
produtos.forEach((p,i)=>{const r=document.createElement("div");r.className="row";r.innerHTML=`<div><div class="name">${p[0]}</div><div class="measure">${p[1]}</div></div><input type="number" min="0" inputmode="numeric" value="0" data-i="${i}">`;lista.appendChild(r)});
const money=v=>v.toLocaleString("pt-BR",{style:"currency",currency:"BRL"});
function calc(){let q=0;document.querySelectorAll("#lista input").forEach(x=>q+=Math.max(0,Number(x.value)||0));const c=document.getElementById("tipo").value==="Construtora";let faixa=q>200?(c?"Construtoras 200+":"Venda 200+"):"Venda <200";let total=0;document.querySelectorAll("#lista input").forEach(x=>{let n=Math.max(0,Number(x.value)||0),p=produtos[Number(x.dataset.i)];let u=q>200?(c?p[4]:p[3]):p[2];total+=n*u});document.getElementById("qtd").textContent=q;document.getElementById("faixa").textContent=faixa;document.getElementById("total").textContent=money(total)}
lista.addEventListener("input",calc);document.getElementById("tipo").addEventListener("change",calc);document.getElementById("limpar").addEventListener("click",()=>{document.querySelectorAll("#lista input").forEach(x=>x.value=0);calc()});calc();
</script>
</body></html>
